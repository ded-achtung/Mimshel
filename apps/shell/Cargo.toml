[package]
name = "shell"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
shell-render = { path = "../../crates/render" }
shell-core = { path = "../../crates/core" }
shell-apps = { path = "../../crates/apps" }
shell-text = { path = "../../crates/text" }
shell-icons = { path = "../../crates/icons" }
shell-x11 = { path = "../../crates/x11" }
shell-launcher = { path = "../../crates/launcher" }
shell-dbus = { path = "../../crates/dbus" }
shell-dock = { path = "../../crates/dock" }
shell-menubar = { path = "../../crates/menubar" }
shell-notify = { path = "../../crates/notify" }
shell-widgets = { path = "../../crates/widgets" }
shell-setup = { path = "../../crates/setup" }
shell-desktop = { path = "../../crates/desktop" }
shell-folder = { path = "../../crates/folder" }
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }
inotify = { version = "0.11.5", default-features = false }
shell-wallpaper = { path = "../../crates/wallpaper" }
tiny-skia = "0.12.0"
pam = "0.8"
shell-lock = { version = "0.1.0", path = "../../crates/lock" }

[lints]
workspace = true
