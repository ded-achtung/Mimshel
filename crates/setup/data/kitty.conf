# mimshel: настройки kitty (mimshel apply look; удалить — вернутся настройки kitty по умолчанию)

# Шрифт: моноширинный системный, размер как у Терминала Xfce
font_family      monospace
font_size        11.0

# Копирование и вставка — как в Терминале Xfce
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
# Программы (Claude Code по SSH, tmux, vim) могут класть текст в буфер обмена
# (OSC 52); читать буфер — только с вопросом.
clipboard_control write-clipboard write-primary read-clipboard-ask read-primary-ask
# Не спрашивать при вставке нескольких строк
paste_actions quote-urls-at-prompt

# Вкладки (Ctrl+Shift+T — новая, Ctrl+Shift+Q — закрыть)
tab_bar_edge     top
tab_bar_style    powerline
tab_powerline_style slanted

# Окно
remember_window_size  yes
initial_window_width  100c
initial_window_height 30c
window_padding_width  6
confirm_os_window_close 1
enable_audio_bell no

# Тёмная тема в цвет Colloid
background            #1e1e2e
foreground            #cdd6f4
selection_background  #45475a
selection_foreground  #cdd6f4
cursor                #f5e0dc
url_color             #89b4fa
active_tab_background   #5294e2
active_tab_foreground   #ffffff
inactive_tab_background #2a2a3a
inactive_tab_foreground #a6adc8
color0  #45475a
color8  #585b70
color1  #f38ba8
color9  #f38ba8
color2  #a6e3a1
