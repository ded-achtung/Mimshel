<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Знак shell: планета с кольцом и надкусом. Рисован с нуля для проекта (GPL-3.0-or-later). -->
  <defs>
    <!-- Кольцо позади планеты прячется за шаром. -->
    <mask id="back"><rect width="64" height="64" fill="#fff"/><circle cx="32" cy="32" r="17" fill="#000"/></mask>
    <!-- Шар: зазор под передней частью кольца и надкус сверху справа. -->
    <mask id="ball">
      <rect width="64" height="64" fill="#fff"/>
      <path d="M3 32A29 9 0 0 0 61 32" transform="rotate(-22 32 32)" fill="none" stroke="#000" stroke-width="10"/>
      <circle cx="41.5" cy="18.5" r="7.5" fill="#000"/>
    </mask>
  </defs>
  <ellipse cx="32" cy="32" rx="29" ry="9" transform="rotate(-22 32 32)" fill="none" stroke="#fff" stroke-width="4" mask="url(#back)"/>
  <circle cx="32" cy="32" r="14" fill="#fff" mask="url(#ball)"/>
  <path d="M3 32A29 9 0 0 0 61 32" transform="rotate(-22 32 32)" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
</svg>
