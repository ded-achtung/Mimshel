[package]
name = "mimshel-x11"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
mimshel-render = { path = "../render" }
mimshel-core = { path = "../core" }
mimshel-platform = { path = "../platform" }
tiny-skia = "0.12.0"
x11rb = { version = "0.14.0", features = ["xkb", "shape", "shm", "render", "xfixes", "randr", "damage"] }
xkeysym = "0.2.1"

[lints]
workspace = true

[dev-dependencies]
x11rb = { version = "0.14.0", features = ["xkb", "xtest"] }
