name: Однократный тег v0.0.1-alpha

on:
  push:
    branches:
      - fix/master-audit-20261024

permissions:
  contents: write

jobs:
  tag:
    if: "${{ github.repository == 'ded-achtung/shell' && github.event.head_commit.message == 'chore: one-shot annotated tag v0.0.1-alpha' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Создать ровно один тег на документированном альфа-коммите
        env:
          TAG_TARGET: "40c0d00c5a2815358a3254f0a339e033b9e03157"
        run: |
          set -euo pipefail
          git cat-file -e "${TAG_TARGET}^{commit}"
          if git ls-remote --exit-code --tags origin refs/tags/v0.0.1-alpha; then
            echo "::error::Tag v0.0.1-alpha already exists; refusing to overwrite."
            exit 1
          fi
          git config user.name "Shell release automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TZ=Europe/Berlin git tag -a v0.0.1-alpha "${TAG_TARGET}" -m "v0.0.1-alpha — 2026-10-25: первый документированный альфа-срез"
          git push origin refs/tags/v0.0.1-alpha
