name: Проверки Rust

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: 1.99.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Инструменты и шрифты для тестов отрисовки
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          sudo apt-get update
          # Wayland uses pkg-config; xkbcommon links directly. EGL/GLES are loaded
          # dynamically by Smithay; winit also loads xkbcommon-x11.
          # No DRM/GBM/libinput/udev backend is enabled.
          sudo apt-get install -y fonts-dejavu-core dbus xvfb xfwm4 xdotool libclang-dev llvm-dev libpam0g-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-0 libegl1 libgles2
      - name: Форматирование
        run: cargo fmt --all -- --check
      - name: Статические проверки
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Тесты без графического сеанса
        run: cargo test --workspace --locked
      - name: Окна на отдельном X-сервере
        run: cargo test -p mimshel-x11 --test windows --locked -- --ignored
      # What install.sh builds and ships: the release profile (thin LTO, no
      # overflow checks) is otherwise never compiled here.
      - name: Сборка как у установщика
        run: cargo build --release --locked -p mimshel
      # The scripts run on users' machines with their settings at stake.
      - name: Сценарии установки
        run: |
          bash -n install.sh tools/make-offline.sh tools/measure-service.sh packaging/third-party.sh
          sh -n tools/nested-session.sh
          shellcheck -S error install.sh tools/*.sh packaging/third-party.sh

  # Known vulnerabilities (RustSec), unmaintained crates, licenses and
  # crate sources — rules in deny.toml.
  deps:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: 1.99.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: cargo-deny
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          cargo install cargo-deny --locked --version 0.20.2
          cargo deny --locked check
