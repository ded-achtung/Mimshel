name: Проверки Rust

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: 1.99.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Инструменты и шрифты для тестов отрисовки
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core dbus xvfb xdotool libclang-dev llvm-dev libpam0g-dev
      - name: Форматирование
        run: cargo fmt --all -- --check
      - name: Статические проверки
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Тесты без графического сеанса
        run: cargo test --workspace --locked
      - name: Окна на отдельном X-сервере
        run: cargo test -p mimshel-x11 --test windows --locked -- --ignored

  # Known vulnerabilities (RustSec), unmaintained crates, licenses and
  # crate sources — rules in deny.toml.
  deps:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: 1.99.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: cargo-deny
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          cargo install cargo-deny --locked --version 0.20.2
          cargo deny --locked check
